<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Álgebra en RA</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{
      width:100%;height:100%;overflow:hidden;
      background:#000;font-family:'Share Tech Mono',monospace;
      touch-action:none;
    }

    /* ── Cámara: fondo completo ── */
    #cam-video{
      position:fixed;top:0;left:0;
      width:100vw;height:100vh;
      object-fit:cover;z-index:0;background:#000;
    }

    /* ── Canvas Three.js: encima del video, transparente ── */
    #three-canvas{
      position:fixed;top:0;left:0;
      width:100vw;height:100vh;
      z-index:1;pointer-events:none;
    }

    /* ── HUD ── */
    #hud{
      position:fixed;inset:0;z-index:10;
      pointer-events:none;
      display:flex;flex-direction:column;justify-content:flex-end;
    }

    /* Score bar */
    #score-bar{
      position:fixed;top:0;left:0;right:0;
      padding:8px 16px 6px;
      display:flex;justify-content:space-between;align-items:center;
      background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,transparent 100%);
      z-index:11;
    }
    #score-bar .lbl{
      font-family:'Orbitron',monospace;font-size:10px;
      letter-spacing:2px;color:#00ff9d66;text-transform:uppercase;
    }
    #score-display{
      font-family:'Orbitron',monospace;font-size:20px;
      letter-spacing:4px;color:#00ff9d;
      text-shadow:0 0 10px #00ff9d,0 0 24px #00ff9d88;
    }
    #q-counter{
      font-family:'Orbitron',monospace;font-size:10px;
      letter-spacing:2px;color:#00d4ff88;
    }

    /* Flash */
    #flash{
      position:fixed;inset:0;pointer-events:none;z-index:9;
      opacity:0;transition:opacity .1s;
    }
    #flash.green{background:rgba(0,255,100,.22);opacity:1;}
    #flash.red  {background:rgba(255,30,30,.26); opacity:1;}
    #flash.fade {opacity:0;}

    /* Borde neón */
    #neon-border{
      position:fixed;inset:0;pointer-events:none;z-index:8;
      border:4px solid transparent;
      transition:border-color .15s,box-shadow .15s;
    }
    #neon-border.green{
      border-color:#00ff64;
      box-shadow:inset 0 0 24px #00ff6444,0 0 24px #00ff6444;
    }
    #neon-border.red{
      border-color:#ff2222;
      box-shadow:inset 0 0 24px #ff222244,0 0 24px #ff222244;
    }

    /* Botones respuesta */
    #options-panel{
      pointer-events:all;
      padding:0 12px 14px;
      display:flex;flex-direction:column;gap:6px;
    }
    .hint-lbl{
      text-align:center;font-size:9px;letter-spacing:3px;
      color:#00d4ff55;margin-bottom:2px;text-transform:uppercase;
    }
    .opt-btn{
      width:100%;padding:9px 10px;
      border:1.5px solid #00ff9d44;border-radius:6px;
      background:rgba(0,0,0,.76);color:#00ff9d;
      font-family:'Share Tech Mono',monospace;font-size:15px;
      letter-spacing:2px;cursor:pointer;
      backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
      transition:background .15s,border-color .15s,box-shadow .15s,transform .1s;
      text-align:center;
    }
    .opt-btn:active {transform:scale(.97);}
    .opt-btn:hover  {background:rgba(0,255,157,.11);border-color:#00ff9d;box-shadow:0 0 12px #00ff9d44;}
    .opt-btn.correct{background:rgba(0,255,100,.24);border-color:#00ff64;box-shadow:0 0 18px #00ff6488;color:#fff;}
    .opt-btn.wrong  {background:rgba(255,30,30,.22); border-color:#ff2222;box-shadow:0 0 14px #ff222266;color:#ff8888;}
    .opt-btn:disabled{cursor:default;}

    /* Hint de superficie */
    #surface-hint{
      position:fixed;top:40%;left:50%;
      transform:translate(-50%,-50%);
      text-align:center;pointer-events:none;
      z-index:12;transition:opacity .4s;
    }
    #surface-hint .sh-ring{
      width:70px;height:70px;
      border:2px solid #00ff9d44;border-radius:50%;
      margin:0 auto 10px;
      display:flex;align-items:center;justify-content:center;
      animation:shpulse 2s infinite;
    }
    #surface-hint .sh-txt{
      font-family:'Orbitron',monospace;font-size:10px;
      letter-spacing:3px;color:#00ff9d77;text-transform:uppercase;
      line-height:1.7;
    }
    #surface-hint.detected .sh-ring{
      border-color:#00ff9dcc;
      box-shadow:0 0 20px #00ff9d44;
      animation:none;
    }
    #surface-hint.detected .sh-txt{
      color:#00ff9d;
      text-shadow:0 0 10px #00ff9d88;
    }
    @keyframes shpulse{
      0%,100%{opacity:.4;transform:scale(1);}
      50%     {opacity:1; transform:scale(1.1);}
    }

    /* Reticle SVG centrado */
    #reticle{
      position:fixed;top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:52px;height:52px;
      pointer-events:none;z-index:13;
      opacity:0;transition:opacity .3s;
    }
    #reticle.show{opacity:1;}

    /* Botón colocar */
    #place-btn{
      position:fixed;bottom:188px;left:50%;
      transform:translateX(-50%);
      padding:10px 26px;
      background:rgba(0,0,0,.82);
      border:1.5px solid #00d4ff;border-radius:30px;
      color:#00d4ff;font-family:'Orbitron',monospace;
      font-size:11px;letter-spacing:2px;cursor:pointer;
      pointer-events:all;z-index:14;
      display:none;text-transform:uppercase;
      box-shadow:0 0 0 #00d4ff00;
      transition:box-shadow .2s;
    }
    #place-btn.show{display:block;}
    #place-btn:hover{box-shadow:0 0 18px #00d4ff55;}

    /* Badge modo (debug) */
    #mode-badge{
      position:fixed;top:52px;right:12px;z-index:12;
      font-family:'Orbitron',monospace;font-size:8px;
      letter-spacing:1px;color:#ffffff33;text-transform:uppercase;
      pointer-events:none;
    }

    /* Popup solución */
    #solution-popup{
      display:none;position:fixed;left:50%;top:44%;
      transform:translate(-50%,-50%) scale(.88);
      width:min(92vw,370px);
      background:rgba(4,12,20,.97);
      border:1.5px solid #00d4ff66;border-radius:12px;
      padding:18px 16px 14px;z-index:20;pointer-events:all;
      box-shadow:0 0 36px #00d4ff33;
      animation:popIn .22s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes popIn{
      from{opacity:0;transform:translate(-50%,-50%) scale(.82);}
      to  {opacity:1;transform:translate(-50%,-50%) scale(1);}
    }
    #solution-popup.visible{display:block;}
    .popup-badge{
      display:inline-block;font-family:'Orbitron',monospace;
      font-size:10px;letter-spacing:3px;padding:3px 10px;
      border-radius:20px;margin-bottom:9px;text-transform:uppercase;
    }
    .popup-badge.correct{background:#00ff6420;color:#00ff64;border:1px solid #00ff6455;}
    .popup-badge.wrong  {background:#ff222220;color:#ff4444;border:1px solid #ff222255;}
    .popup-title{
      font-family:'Orbitron',monospace;font-size:11px;
      color:#00d4ff;letter-spacing:2px;margin-bottom:10px;
      text-shadow:0 0 8px #00d4ff88;
    }
    .popup-eq{
      font-family:'Orbitron',monospace;font-size:14px;
      color:#00ff9d;text-align:center;margin-bottom:10px;
      text-shadow:0 0 8px #00ff9d88;letter-spacing:2px;
    }
    .step-list{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
    .step-list li{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:#c8ffe8;line-height:1.5;}
    .step-num{
      flex-shrink:0;width:17px;height:17px;border-radius:50%;
      background:#00d4ff22;border:1px solid #00d4ff55;
      color:#00d4ff;font-size:8px;
      display:flex;align-items:center;justify-content:center;
      font-family:'Orbitron',monospace;
    }
    .step-text em{font-style:normal;color:#00ff9d;font-weight:bold;}
    #next-btn{
      width:100%;padding:11px;
      background:linear-gradient(135deg,#00d4ff22,#00ff9d22);
      border:1.5px solid #00d4ff;border-radius:7px;
      color:#00d4ff;font-family:'Orbitron',monospace;
      font-size:11px;letter-spacing:3px;cursor:pointer;
      text-transform:uppercase;transition:background .15s,box-shadow .15s;
    }
    #next-btn:hover{background:linear-gradient(135deg,#00d4ff44,#00ff9d33);box-shadow:0 0 16px #00d4ff66;}
  </style>
</head>
<body>

<!-- Cámara trasera: fondo 100vw x 100vh -->
<video id="cam-video" autoplay playsinline muted></video>

<!-- Canvas Three.js transparente sobre el video -->
<canvas id="three-canvas"></canvas>

<!-- Score bar -->
<div id="score-bar">
  <div>
    <div class="lbl">Score</div>
    <div id="score-display">000</div>
  </div>
  <div id="q-counter">Q 1 / ∞</div>
</div>

<div id="flash"></div>
<div id="neon-border"></div>
<div id="mode-badge">iniciando...</div>

<!-- Reticle (anillo de anclaje) -->
<div id="reticle">
  <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="26" cy="26" r="20" stroke="#00ff9d" stroke-width="1.5"
            stroke-dasharray="5 4" opacity=".9"/>
    <circle cx="26" cy="26" r="3.5" fill="#00ff9d" opacity=".9"/>
    <line x1="26" y1="4"  x2="26" y2="13" stroke="#00ff9d" stroke-width="1.5"/>
    <line x1="26" y1="39" x2="26" y2="48" stroke="#00ff9d" stroke-width="1.5"/>
    <line x1="4"  y1="26" x2="13" y2="26" stroke="#00ff9d" stroke-width="1.5"/>
    <line x1="39" y1="26" x2="48" y2="26" stroke="#00ff9d" stroke-width="1.5"/>
  </svg>
</div>

<!-- Hint de superficie -->
<div id="surface-hint">
  <div class="sh-ring">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="4" y="10" width="20" height="12" rx="2"
            stroke="#00ff9d" stroke-width="1.4" opacity=".7"/>
      <path d="M8 10V8a6 6 0 0112 0v2" stroke="#00ff9d" stroke-width="1.4" opacity=".5"/>
    </svg>
  </div>
  <div class="sh-txt" id="hint-txt">BUSCA UNA<br>SUPERFICIE PLANA</div>
</div>

<!-- Botón colocar -->
<button id="place-btn" onclick="placeEquation()">⊕ &nbsp;Colocar aquí</button>

<!-- Botones respuesta (ocultos hasta colocar ecuación) -->
<div id="hud">
  <div id="options-panel" style="display:none;">
    <div class="hint-lbl">Selecciona la respuesta</div>
    <button class="opt-btn" id="btn0" onclick="checkAnswer(0)">-</button>
    <button class="opt-btn" id="btn1" onclick="checkAnswer(1)">-</button>
    <button class="opt-btn" id="btn2" onclick="checkAnswer(2)">-</button>
  </div>
</div>

<!-- Popup solución -->
<div id="solution-popup">
  <span id="popup-badge" class="popup-badge correct">Correcto</span>
  <div class="popup-title">PROCEDIMIENTO PASO A PASO</div>
  <div class="popup-eq" id="popup-eq"></div>
  <ul class="step-list" id="step-list"></ul>
  <button id="next-btn" onclick="nextQuestion()">▶ &nbsp;Siguiente Ejercicio</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ════════════════════════════════════════
   MOTOR DE EJERCICIOS (sin cambios)
════════════════════════════════════════ */
function gcd(a,b){return b===0?Math.abs(a):gcd(b,a%b);}
function frac(num,den){
  if(den<0){num=-num;den=-den;}
  const g=gcd(Math.abs(num),den);
  return{num:num/g,den:den/g};
}
function fmt(f){return f.den===1?String(f.num):`${f.num}/${f.den}`;}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}
function genExercise(){
  const type=randInt(0,3);
  let eq,ans,steps,label;
  if(type===0){
    const a=randInt(2,9),b=randInt(1,8),c=randInt(b+2,b+a*6);
    eq=`${a}x + ${b} = ${c}`;ans=frac(c-b,a);label=fmt(ans);
    steps=[`Ecuacion: <em>${eq}</em>`,`Restamos ${b}: <em>${a}x = ${c-b}</em>`,
           `Dividimos entre ${a}: <em>x = ${c-b}/${a}</em>`,`Resultado: <em>x = ${label}</em>`];
  }else if(type===1){
    const a=randInt(2,9),b=randInt(1,8),c=randInt(1,a*6);
    eq=`${a}x - ${b} = ${c}`;ans=frac(c+b,a);label=fmt(ans);
    steps=[`Ecuacion: <em>${eq}</em>`,`Sumamos ${b}: <em>${a}x = ${c+b}</em>`,
           `Dividimos entre ${a}: <em>x = ${c+b}/${a}</em>`,`Resultado: <em>x = ${label}</em>`];
  }else if(type===2){
    const a=randInt(2,9),c=randInt(1,a*7);
    eq=`${a}x = ${c}`;ans=frac(c,a);label=fmt(ans);
    steps=[`Ecuacion: <em>${eq}</em>`,`Dividimos entre ${a}`,
           `<em>x = ${c}/${a}</em>`,`Resultado: <em>x = ${label}</em>`];
  }else{
    const a=randInt(2,6),b=randInt(1,5),c=randInt(b+2,b+8);
    eq=`x/${a} + ${b} = ${c}`;const xv=a*(c-b);ans=frac(xv,1);label=String(xv);
    steps=[`Ecuacion: <em>${eq}</em>`,`Restamos ${b}: <em>x/${a} = ${c-b}</em>`,
           `Multiplicamos por ${a}: <em>x = ${a} x ${c-b}</em>`,`Resultado: <em>x = ${label}</em>`];
  }
  const opts=[label];
  while(opts.length<3){
    const d=fmt(frac(ans.num+randInt(1,4)*(Math.random()<.5?1:-1)*ans.den,ans.den));
    if(!opts.includes(d))opts.push(d);
  }
  shuffle(opts);
  return{eq,ans,label,opts,correct:opts.indexOf(label),steps};
}

/* ════════════════════════════════════════
   THREE.JS — ESCENA
════════════════════════════════════════ */
const cvs3d = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({canvas:cvs3d,alpha:true,antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x000000,0); // transparente

const scene  = new THREE.Scene();
/* Cámara perspectiva — FOV se calibrará según el stream de video */
const camera = new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.001,100);
scene.add(camera);

/* Grupo de la ecuación — empieza oculto */
const eqGroup = new THREE.Group();
eqGroup.visible = false;
scene.add(eqGroup);

/* ── Canvas 2D → textura ecuación ──────────────────────────
   Resolución: 1024 x 320 px  (ratio 3.2:1)
   Geometría:  0.32m x 0.10m  (mismo ratio, sin distorsión)
   Fondo + borde + texto se dibujan en UN SOLO canvas:
   imposible el z-fighting entre fondo y texto.
   ────────────────────────────────────────────────────────── */
const EQ_CW = 1024, EQ_CH = 320;   // canvas en pixels
const EQ_W  = 0.32,  EQ_H  = 0.10; // ancho/alto en metros (mismo ratio)

const eqCvs = document.createElement('canvas');
eqCvs.width  = EQ_CW;
eqCvs.height = EQ_CH;
const eqCtx = eqCvs.getContext('2d');
const eqTex = new THREE.CanvasTexture(eqCvs);

const eqMat = new THREE.MeshBasicMaterial({
  map: eqTex,
  transparent: true,
  depthWrite: false,      // no escribe depth -> nunca genera z-fighting
  depthTest: true,
  side: THREE.DoubleSide
});

/* Geometria con exactamente el mismo ratio que el canvas */
const eqMesh = new THREE.Mesh(new THREE.PlaneGeometry(EQ_W, EQ_H), eqMat);
eqMesh.renderOrder = 999;  // siempre dibujado encima de cualquier otro mesh
eqMesh.position.y  = 0.004; // 4mm sobre el plano del grupo -> evita z-fighting con la superficie
eqGroup.add(eqMesh);

/* SIN cajas 3D adicionales: el fondo se pinta dentro del canvas,
   nunca puede quedar por encima del texto porque estan en el mismo plano. */

/* Dibuja fondo + borde + texto en un solo canvas 2D */
function drawEquation(text){
  const cw=EQ_CW, ch=EQ_CH, ctx=eqCtx;
  eqCvs.width=cw; eqCvs.height=ch;   // resetea y limpia
  ctx.clearRect(0,0,cw,ch);

  /* Fondo redondeado con padding interior */
  const r=40, pad=10;
  ctx.fillStyle='rgba(0,10,3,0.84)';
  ctx.beginPath();
  ctx.moveTo(r+pad,pad);       ctx.lineTo(cw-r-pad,pad);
  ctx.quadraticCurveTo(cw-pad,pad,    cw-pad,r+pad);
  ctx.lineTo(cw-pad,ch-r-pad);
  ctx.quadraticCurveTo(cw-pad,ch-pad, cw-r-pad,ch-pad);
  ctx.lineTo(r+pad,ch-pad);
  ctx.quadraticCurveTo(pad,ch-pad,    pad,ch-r-pad);
  ctx.lineTo(pad,r+pad);
  ctx.quadraticCurveTo(pad,pad,       r+pad,pad);
  ctx.closePath();
  ctx.fill();

  /* Borde neon */
  ctx.strokeStyle='#00FF00';
  ctx.lineWidth=6;
  ctx.shadowColor='#00FF00';
  ctx.shadowBlur=22;
  ctx.stroke();

  /* Texto: autoajuste de tamano para que siempre quepa
     Empieza en 88px, reduce hasta que mida menos de (cw - 100px) */
  ctx.textAlign   ='center';
  ctx.textBaseline='middle';
  ctx.shadowColor ='#00FF00';

  let fs=88;
  ctx.font=`bold ${fs}px monospace`;
  while(ctx.measureText(text).width > cw-100 && fs>36){
    fs-=4;
    ctx.font=`bold ${fs}px monospace`;
  }

  ctx.shadowBlur=20;
  ctx.fillStyle='#00FF00';
  ctx.fillText(text, cw/2, ch/2);  /* centro exacto del canvas */

  eqTex.needsUpdate=true;
}

window.addEventListener('resize',()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

/* ════════════════════════════════════════
   CÁMARA TRASERA
════════════════════════════════════════ */
const video=document.getElementById('cam-video');

async function startCamera(){
  const constraints=[
    {video:{facingMode:{exact:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},
    {video:{facingMode:'environment'},audio:false},
    {video:true,audio:false}
  ];
  for(const c of constraints){
    try{
      const stream=await navigator.mediaDevices.getUserMedia(c);
      video.srcObject=stream;
      await new Promise(r=>video.onloadedmetadata=r);
      return true;
    }catch(e){}
  }
  alert('No se pudo acceder a la cámara trasera.');
  return false;
}

/* ════════════════════════════════════════
   DETECCIÓN DE SUPERFICIES
   ─────────────────────────────────────
   MODO 1: WebXR Hit Test (Chrome Android 81+)
     — Detección real de planos mediante sensores de profundidad.
     — Coloca la ecuación exactamente sobre el plano detectado.
     — Requiere HTTPS y permiso de cámara.

   MODO 2: DeviceOrientation + Estimación visual
     — Usa acelerómetro/giroscopio del celular.
     — Detecta cuándo el celular apunta a una superficie horizontal.
     — Estima posición por trigonometría con beta (inclinación).
     — Funciona sin WebXR en todos los Android modernos.
════════════════════════════════════════ */
let mode='none';            // 'webxr' | 'orientation'
let surfaceReady=false;
let equationPlaced=false;

/* Datos WebXR */
let xrSession=null;
let xrViewerSpace=null;
let xrLocalSpace=null;
let xrHitSource=null;
let lastHitPose=null;       // XRRigidTransform del último hit

/* Datos orientación */
let devBeta=0;              // inclinación adelante-atrás (0=plano, 90=vertical)
let devAlpha=0;             // rotación brújula
let devGamma=0;             // inclinación lateral
let orientPermission=false;

/* Estado de juego */
let score=0,qNum=1,cur=null;

/* ─── MODO 1: WebXR ─── */
async function tryWebXR(){
  if(!navigator.xr) return false;
  try{
    const ok=await navigator.xr.isSessionSupported('immersive-ar');
    if(!ok) return false;
  }catch(e){ return false; }

  try{
    xrSession=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test','local'],
      optionalFeatures:['dom-overlay','anchors'],
      domOverlay:{root:document.body}
    });

    /* Configurar WebGL layer para WebXR */
    const gl=renderer.getContext();
    await gl.makeXRCompatible();
    xrSession.updateRenderState({
      baseLayer: new XRWebGLLayer(xrSession, gl)
    });

    /* Espacios de referencia */
    xrLocalSpace  = await xrSession.requestReferenceSpace('local');
    xrViewerSpace = await xrSession.requestReferenceSpace('viewer');

    /* Fuente de hit-test desde el centro de la vista del usuario */
    xrHitSource=await xrSession.requestHitTestSource({space:xrViewerSpace});

    xrSession.addEventListener('end',()=>{
      xrSession=null;xrHitSource=null;lastHitPose=null;
      /* Si la sesión WebXR termina, caer a orientación */
      mode='orientation';
      setBadge('orientacion (fallback)');
      startOrientationMode();
    });

    mode='webxr';
    setBadge('WebXR Hit Test');
    renderer.xr.enabled=true;
    renderer.xr.setSession(xrSession);
    /* Ocultar video (WebXR usa su propio pass-through) */
    video.style.display='none';
    xrSession.requestAnimationFrame(xrLoop);
    return true;
  }catch(e){
    console.warn('WebXR error:',e);
    return false;
  }
}

/* Loop de animación WebXR */
function xrLoop(t,frame){
  if(!xrSession) return;
  xrSession.requestAnimationFrame(xrLoop);

  if(!xrHitSource||!xrLocalSpace) return;

  /* Hit test */
  const hits=frame.getHitTestResults(xrHitSource);
  if(hits.length>0){
    const hitPose=hits[0].getPose(xrLocalSpace);
    if(hitPose){
      lastHitPose=hitPose;
      if(!equationPlaced){
        /* Mover el reticle/grupo a la posición del hit */
        const m=hitPose.transform.matrix;
        const pos=new THREE.Vector3(m[12],m[13],m[14]);
        /* Actualizar posición del eqGroup (como preview) */
        eqGroup.position.copy(pos);
        /* Orientar según la normal del plano detectado */
        const quat=new THREE.Quaternion(
          hitPose.transform.orientation.x,
          hitPose.transform.orientation.y,
          hitPose.transform.orientation.z,
          hitPose.transform.orientation.w
        );
        eqGroup.quaternion.copy(quat);
        /* Rotar para que el texto quede visible (plano horizontal → texto hacia arriba) */
        eqGroup.rotateX(-Math.PI/2);
        setSurfaceReady(true);
      }
    }
  }else{
    if(!equationPlaced) setSurfaceReady(false);
  }

  renderer.render(scene,camera);
}

/* ─── MODO 2: DeviceOrientation ─── */
function startOrientationMode(){
  mode='orientation';
  setBadge('Giroscopio');

  /* iOS 13+ requiere permiso explícito */
  if(typeof DeviceOrientationEvent!=='undefined' &&
     typeof DeviceOrientationEvent.requestPermission==='function'){
    /* Crear botón de permiso para iOS */
    const iosBtn=document.createElement('button');
    iosBtn.textContent='Permitir movimiento';
    iosBtn.style.cssText=`position:fixed;bottom:210px;left:50%;transform:translateX(-50%);
      z-index:15;padding:10px 20px;background:rgba(0,0,0,.8);color:#00d4ff;
      border:1.5px solid #00d4ff;border-radius:20px;font-family:Orbitron,monospace;
      font-size:11px;letter-spacing:2px;cursor:pointer;`;
    document.body.appendChild(iosBtn);
    iosBtn.onclick=async()=>{
      try{
        const r=await DeviceOrientationEvent.requestPermission();
        if(r==='granted'){
          window.addEventListener('deviceorientation',onOrient,true);
          orientPermission=true;
        }
      }catch(e){}
      iosBtn.remove();
    };
  }else{
    window.addEventListener('deviceorientation',onOrient,true);
    orientPermission=true;
  }
  startOrientationRenderLoop();
}

function onOrient(e){
  devAlpha=e.alpha||0;
  devBeta =e.beta ||0;
  devGamma=e.gamma||0;
  /*
    beta:  0°  = celular plano boca arriba
           90° = celular vertical (mirando hacia adelante)
    Para apuntar a una mesa el beta suele estar entre 30° y 75°.
    Para una hoja en el suelo: 0-30°.
    Consideramos superficie válida: beta entre 20° y 78°.
  */
  const ok=devBeta>20 && devBeta<78;
  if(!equationPlaced) setSurfaceReady(ok);
}

/* Render loop normal (sin WebXR) */
function startOrientationRenderLoop(){
  /* Ajustar rotación de la cámara Three.js según giroscopio */
  function loop(){
    requestAnimationFrame(loop);

    if(mode==='orientation' && orientPermission){
      /*
        Mapeo: beta (30-75°) → ángulo de visión hacia el suelo.
        Convertir grados a radianes y aplicar a la cámara.
        Se invierte para que mirar hacia abajo sea positivo en X.
      */
      const betaRad =THREE.MathUtils.degToRad(devBeta -90); // 0 al frente
      const gammaRad=THREE.MathUtils.degToRad(devGamma);

      /* Rotación Euler ZXY que imita la orientación del dispositivo */
      camera.rotation.order='YXZ';
      camera.rotation.x=-betaRad;   // inclinación adelante-atrás
      camera.rotation.z=-gammaRad;  // inclinación lateral
      camera.rotation.y=0;

      /* Actualizar posición del objeto si está en modo preview */
      if(!equationPlaced && surfaceReady){
        /*
          Colocar la ecuación delante de la cámara a distancia estimada.
          La distancia d se estima con: d = alturaOjo / tan(beta)
          Asumiendo alturaOjo ≈ 0.4m (celular en mano apuntando a mesa)
        */
        const betaDeg=Math.max(20,Math.min(devBeta,78));
        const betaR=THREE.MathUtils.degToRad(betaDeg);
        const dist=Math.min(0.4/Math.tan(betaR),2.0);

        /* Calcular posición frente a la cámara */
        const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
        const pos=camera.position.clone().addScaledVector(dir,dist);
        /* Bajar a la superficie estimada */
        pos.y-=0.4*Math.sin(betaR);
        eqGroup.position.copy(pos);

        /* Orientar el plano perpendicular a la normal de la superficie */
        eqGroup.rotation.copy(camera.rotation);
        eqGroup.rotateX(-Math.PI/2+betaR*0.3);
      }
    }

    renderer.render(scene,camera);
  }
  loop();
}

/* ─── Estado de superficie ─── */
function setSurfaceReady(ok){
  if(surfaceReady===ok) return;
  surfaceReady=ok;
  const hint   =document.getElementById('surface-hint');
  const reticle=document.getElementById('reticle');
  const placeB =document.getElementById('place-btn');
  const hintTxt=document.getElementById('hint-txt');
  if(ok){
    hint.classList.add('detected');
    hintTxt.innerHTML='SUPERFICIE<br>DETECTADA';
    reticle.classList.add('show');
    placeB.classList.add('show');
  }else{
    hint.classList.remove('detected');
    hintTxt.innerHTML='BUSCA UNA<br>SUPERFICIE PLANA';
    reticle.classList.remove('show');
    placeB.classList.remove('show');
  }
}

/* ════════════════════════════════════════
   COLOCAR ECUACIÓN SOBRE EL PLANO
════════════════════════════════════════ */
function placeEquation(){
  if(!surfaceReady&&!equationPlaced) return;

  if(mode==='webxr' && lastHitPose){
    /* Usar la posición exacta del hit-test */
    const m=lastHitPose.transform.matrix;
    eqGroup.position.set(m[12],m[13]+0.005,m[14]); // +5mm sobre el plano
    const q=new THREE.Quaternion(
      lastHitPose.transform.orientation.x,
      lastHitPose.transform.orientation.y,
      lastHitPose.transform.orientation.z,
      lastHitPose.transform.orientation.w
    );
    eqGroup.quaternion.copy(q);
    eqGroup.rotateX(-Math.PI/2); // rotar para que el texto mire hacia la cámara
  }
  /* En modo orientación el grupo ya está posicionado por el loop */

  drawEquation(cur?cur.eq:'7x - 4 = 23');
  eqGroup.visible=true;
  equationPlaced=true;

  /* Ocultar controles de búsqueda, mostrar botones */
  const hint=document.getElementById('surface-hint');
  hint.style.opacity='0';
  setTimeout(()=>{hint.style.display='none';},400);
  document.getElementById('reticle').classList.remove('show');
  document.getElementById('place-btn').classList.remove('show');
  document.getElementById('options-panel').style.display='flex';
}

/* ════════════════════════════════════════
   LÓGICA DE PREGUNTAS / UI
════════════════════════════════════════ */
function loadQuestion(){
  cur=genExercise();
  if(equationPlaced) drawEquation(cur.eq);
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{
    b.textContent=`x = ${cur.opts[i]}`;
    b.className='opt-btn';b.disabled=false;
  });
  document.getElementById('q-counter').textContent=`Q ${qNum} / ∞`;
  document.getElementById('solution-popup').classList.remove('visible');
}

function checkAnswer(idx){
  if(!cur) return;
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  const ok=idx===cur.correct;
  doFlash(ok?'green':'red');
  document.querySelectorAll('.opt-btn')[cur.correct].classList.add('correct');
  if(!ok) document.querySelectorAll('.opt-btn')[idx].classList.add('wrong');
  score=Math.max(0,score+(ok?10:-5));
  document.getElementById('score-display').textContent=String(score).padStart(3,'0');
  showPopup(ok);
}

function doFlash(color){
  const f=document.getElementById('flash'),nb=document.getElementById('neon-border');
  f.className=color;nb.className=color;
  setTimeout(()=>{f.classList.add('fade');nb.className='';},600);
  setTimeout(()=>{f.className='';},760);
}

function showPopup(ok){
  const pop  =document.getElementById('solution-popup');
  const badge=document.getElementById('popup-badge');
  document.getElementById('popup-eq').textContent=cur.eq;
  badge.className=`popup-badge ${ok?'correct':'wrong'}`;
  badge.textContent=ok?'✓  Correcto  +10':'✗  Incorrecto  −5';
  const list=document.getElementById('step-list');
  list.innerHTML='';
  cur.steps.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="step-num">${i+1}</span><span class="step-text">${s}</span>`;
    list.appendChild(li);
  });
  pop.classList.add('visible');
}

function nextQuestion(){
  qNum++;
  loadQuestion();
}

function setBadge(txt){
  document.getElementById('mode-badge').textContent='modo: '+txt;
}

/* ════════════════════════════════════════
   INICIO
════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded',async()=>{
  const camOk=await startCamera();
  if(!camOk) return;
  loadQuestion();

  /* Intentar WebXR primero; si falla, usar giroscopio */
  const xrOk=await tryWebXR();
  if(!xrOk){
    startOrientationMode();
  }
});
</script>
